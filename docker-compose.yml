
services:
  geodata-inspector:
    build: .
    ports:
      - "5050:5050"
    volumes:
      - geodata_uploads:/tmp/geodata_uploads
      - ./web_app/config.yaml:/app/web_app/config.yaml
    environment:
      - PYTHONUNBUFFERED=1
      - HOST=0.0.0.0
    restart: unless-stopped

volumes:
  geodata_uploads: